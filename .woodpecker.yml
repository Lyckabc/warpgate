when:
  branch: fix-ssh-sso-auth

labels:
  platform: linux/amd64

steps:
  - name: build-warpgate
    image: rust:1.94.1-bullseye
    commands:
      - apt-get update
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y --no-install-recommends ca-certificates-java nodejs openjdk-17-jdk
      - cargo install --locked just@1.4.0
      - export SOURCE_DATE_EPOCH=0
      - mkdir -p ~/.cargo
      - |
        cat > ~/.cargo/config.toml <<'EOF'
        [net]
        retry = 10
        git-fetch-with-cli = true
        [http]
        timeout = 120
        low-speed-limit = 5
        multiplexing = false
        EOF
      - just npm ci
      - just openapi
      - just npm run build
      - cargo build --features mysql,postgres --release
      - ls -lh target/release/warpgate
      - file target/release/warpgate
      - ./target/release/warpgate --help || echo "Binary is valid (no --version flag)"

  - name: save-artifact
    image: alpine:3.18
    commands:
      - apk add --no-cache tar gzip
      - cd target/release
      - tar czf /tmp/warpgate-${CI_COMMIT_SHA:0:8}.tar.gz warpgate
      - cp warpgate /tmp/warpgate-binary
      - echo "=== ARTIFACT INFO ==="
      - echo "Filename warpgate-${CI_COMMIT_SHA:0:8}.tar.gz"
      - stat -c%s /tmp/warpgate-${CI_COMMIT_SHA:0:8}.tar.gz
      - sha256sum /tmp/warpgate-${CI_COMMIT_SHA:0:8}.tar.gz
      - echo "=== WAITING 600 SECONDS FOR DOWNLOAD ==="
      - echo "Download with kubectl cp <pod>:/tmp/warpgate-binary ./warpgate"
      - sh -c 'i=0; while [ $i -lt 600 ]; do echo "Waiting... $i/600"; sleep 10; i=$((i+10)); done'
