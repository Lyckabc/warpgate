when:
  branch: fix-ssh-sso-auth

labels:
  platform: linux/amd64

steps:
  - name: build-warpgate
    image: rust:1.94.1-bullseye
    commands:
      - apt-get update
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y --no-install-recommends ca-certificates-java nodejs openjdk-17-jdk
      - cargo install --locked just@1.4.0
      - export SOURCE_DATE_EPOCH=0
      - just npm ci
      - just openapi
      - just npm run build
      - cargo build --features mysql,postgres --release
      - ls -lh target/release/warpgate
      - file target/release/warpgate
      - ./target/release/warpgate --version

  - name: upload-artifact
    image: alpine:3.18
    commands:
      - apk add --no-cache curl
      - |
        ARTIFACT_URL="https://artifact-keeper.toji.homes/api/v1/artifacts/warpgate/warpgate-${CI_COMMIT_SHA:0:8}"
        echo "Uploading to artifact-keeper..."
        curl -f -X PUT -H "Content-Type: application/octet-stream" \
          --data-binary @target/release/warpgate \
          "${ARTIFACT_URL}" || echo "Upload failed, continuing..."
        echo "Binary size: $(stat -c%s target/release/warpgate) bytes"
