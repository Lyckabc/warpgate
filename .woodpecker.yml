when:
  branch: fix-ssh-sso-auth

labels:
  platform: linux/amd64

volumes:
  - name: artifacts
    claim: woodpecker-artifacts

steps:
  - name: build-warpgate
    image: rust:1.94.1-bullseye
    volumes:
      - name: artifacts
        path: /artifacts
    commands:
      - apt-get update
      - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      - apt-get install -y --no-install-recommends ca-certificates-java nodejs openjdk-17-jdk
      - cargo install --locked just@1.4.0
      - export SOURCE_DATE_EPOCH=0
      - mkdir -p ~/.cargo
      - |
        cat > ~/.cargo/config.toml <<'EOF'
        [net]
        retry = 10
        git-fetch-with-cli = true
        [http]
        timeout = 120
        low-speed-limit = 5
        multiplexing = false
        EOF
      - just npm ci
      - just openapi
      - just npm run build
      - cargo build --features mysql,postgres --release
      - ls -lh target/release/warpgate
      - file target/release/warpgate
      - ./target/release/warpgate --help || echo "Binary is valid (no --version flag)"

  - name: save-artifact
    image: alpine:3.18
    volumes:
      - name: artifacts
        path: /artifacts
    commands:
      - apk add --no-cache tar gzip coreutils
      - cd target/release
      - TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      - ARTIFACT_DIR="/artifacts/warpgate/${CI_COMMIT_BRANCH}/${CI_COMMIT_SHA:0:8}-${TIMESTAMP}"
      - mkdir -p "$ARTIFACT_DIR"
      - cp warpgate "$ARTIFACT_DIR/warpgate"
      - tar czf "$ARTIFACT_DIR/warpgate.tar.gz" warpgate
      - ln -sf "$ARTIFACT_DIR/warpgate" /artifacts/warpgate/latest
      - echo "=== ARTIFACT SAVED ==="
      - echo "Location $ARTIFACT_DIR/warpgate"
      - ls -lh "$ARTIFACT_DIR"
      - sha256sum "$ARTIFACT_DIR/warpgate"
      - sha256sum "$ARTIFACT_DIR/warpgate.tar.gz"
      - echo "=== DOWNLOAD COMMAND ==="
      - echo "kubectl -n metaflow cp woodpecker-artifacts:/warpgate/latest ./warpgate-latest"
